kind = "mobile"
previewPath = "/"
title = "Spark AI"
version = "1.0.0"
id = "artifacts/spark-ai"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19522

[services.development]
run = "pnpm --filter @workspace/spark-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spark-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/spark-ai", "run", "serve" ]

[services.env]
PORT = "19522"
BASE_PATH = "/"
